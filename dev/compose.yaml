name: bqatlas-rust-dev
services:
  postgres:
    image: postgres:18
    network_mode: bridge
    environment:
      POSTGRES_USER: bqatlas
      POSTGRES_PASSWORD: bqatlas-rust-dev-only
      POSTGRES_DB: bqatlas_rust_dev
    ports: ["127.0.0.1:25433:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bqatlas -d bqatlas_rust_dev"]
      interval: 5s
      timeout: 3s
      retries: 20
  sqlserver:
    profiles: [sqlserver]
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    network_mode: bridge
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${BQATLAS_SQLSERVER_PASSWORD:-RustAtlas-Db!2026}
    ports: ["127.0.0.1:21434:1433"]
    volumes: ["sqlserver-data:/var/opt/mssql"]
  keycloak:
    profiles: [oidc]
    image: quay.io/keycloak/keycloak:26.7.4
    network_mode: bridge
    command: [start-dev, --import-realm]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: rust-dev-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: RustKeycloak-Dev!2026
      KC_HOSTNAME: http://127.0.0.1:28182
    ports: ["127.0.0.1:28182:8080"]
    volumes: ["./keycloak:/opt/keycloak/data/import:ro"]
volumes:
  postgres-data:
  sqlserver-data:
