[workspace]
resolver = "2"
members = ["crates/*", "samples/crm/server", "samples/crm/modules/*"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/binaryquest/bqAtlasRust"

[workspace.dependencies]
async-trait = "0.1.89"
axum = { version = "0.8.8", features = ["macros"] }
argon2 = "0.5.3"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.5.60", features = ["derive", "env"] }
http = "1.3"
http-body-util = "0.1"
rand = "0.8.5"
rust_decimal = { version = "1.40", features = ["serde-with-str"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "rust_decimal", "json"] }
subtle = "2.6.1"
thiserror = "2.0.17"
tiberius = { version = "0.12.3", default-features = false, features = ["rustls", "tds73", "chrono", "rust_decimal"] }
time = { version = "0.3.44", features = ["serde"] }
tokio = { version = "1.50", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["compat"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "fs", "timeout", "request-id", "limit"] }
tower-sessions = "0.14.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
uuid = { version = "1.18", features = ["v4", "v5", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
